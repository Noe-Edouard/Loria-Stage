setup:
  name: engine
  input_dir: data/test
  output_dir: outputs/engine
  log_dir: logs
  log_file: engine
  debug_mode: true
  display_mode: true
  save_mode: true

experiment:
  load:
    normalize: true
    crop: true
    target_shape: [64, 64, 64]
    input_file: test.nii
    output_file: null

  methods:
    derivator: default
    enhancer: frangi
    segmenter: thresholding

  hessian:
    mode: reflect
    cval: 0.0

  processing:
    normalize: true
    parallelize: true
    chunk_size: [16, 16, 16]
    overlap_size: null

  enhancement:
    alpha: 0.5
    beta: 0.5
    gamma: 15
    scales: [2, 4, 6, 8]
    scales_number: null
    scales_range: null
    black_ridges: false
    skimage: false

  segmentation:
    threshold: null

runner:
  ssi:
    volume_size: 256
    scales_range: [1, 10]
    scales_numbers: [1, 2, 3]
    output_file: engine_scale_size

  vsi:
    volume_sizes: [32, 64, 128]
    output_file: engine_volume_size

  cni:
    volume_sizes: [32, 64, 128]
    chunk_numbers: [2, 4, 8]
    output_file: engine_chunk_number
  pac:
    input_file: test.nii
    output_file: engine_para_accuracy
