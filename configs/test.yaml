setup:
  name: test_benchmark
  input_dir: data/test
  output_dir: outputs/test
  log_file: benchmark.log
  debug_mode: true
  display_mode: true
  save_mode: false

experiment:
  load:
    normalize: true
    crop: false
    target_shape: [64, 64, 1]
    input_file: null

  methods:
    derivator: default
    enhancer: frangi
    segmenter: thresholding

  hessian:
    mode: reflect
    cval: 0.0

  processing:
    normalize: true
    parallelize: false
    chunk_size: [32, 32, 1]
    overlap_size: 0

  enhancement:
    alpha: 0.5
    beta: 0.5
    gamma: 1
    scales: [1]
    scales_number: null
    scales_range: null
    black_ridges: true
    skimage: false

  segmentation:
    threshold: 0.5

runner:
  params_grid:
    alpha: [0.5]
    beta: [0.5]
    gamma: [1]
  methods: ["default"]
  raw_file: raw.png
  gt_file: gt.png
