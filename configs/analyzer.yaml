setup:
  name: "analyzer_experiment"
  input_dir: "data/test"
  output_dir: "outputs/analyzer"
  log_file: "analyzer.log"
  debug_mode: true
  display_mode: false
  save_mode: false

experiment:
  load:
    normalize: true
    crop: true
    target_shape: [64, 64, 64]
    input_file: test.nii

  methods:
    derivator: default
    enhancer: frangi
    segmenter: thresholding

  hessian:
    mode: reflect
    cval: 0.0

  processing:
    normalize: true
    parallelize: true
    chunk_size: [16, 16, 16]
    overlap_size: null

  enhancement:
    alpha: 0.5
    beta: 0.5
    gamma: 15
    scales: [2, 4, 6, 8]
    scales_number: null
    scales_range: null
    black_ridges: true
    skimage: false

  segmentation:
    threshold: null

runner:
  images_dir: "images"
  labels_dir: "labels"
  csi:
    scales_steps: [1, 2, 3]
    max_ranges: [10, 15, 20]
    min_ranges: [1, 2, 3]
  cpi:
    alpha_values: [0.1, 0.5]
    beta_values: [0.1, 0.5]
    gamma_values: [0.1, 0.5]
