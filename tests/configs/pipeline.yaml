setup:
  name: test_benchmark
  input_dir: test
  output_dir: test
  log_file: test
  debug_mode: true
  display_mode: true
  save_mode: true

experiment:
  loading:
    normalize: true
    crop: true
    target_shape: [64, 64, 64]
    input_file: null

  methods:
    derivator: default
    enhancer: frangi
    segmenter: thresholding

  hessian:
    mode: reflect
    cval: 0.0

  processing:
    normalize: true
    parallelize: false
    chunk_size: [32, 32, 32]
    overlap_size: 8

  enhancement:
    alpha: 0.5
    beta: 0.5
    gamma: 15
    scales: [0, 2, 4, 6, 8]
    scales_number: null
    scales_range: null
    black_ridges: false
    skimage: false

  segmentation:
    threshold: null
